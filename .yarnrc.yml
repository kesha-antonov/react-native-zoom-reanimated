# React Native tooling (Metro, the Expo CLI, ESLint's config loader) expects a
# real node_modules tree. Yarn defaults to Plug'n'Play, so pin the linker here
# rather than relying on a machine-level ~/.yarnrc.yml.
nodeLinker: node-modules

# Needed for install-time scripts: React Native packages rely on postinstall,
# and this package's own `prepare` hook runs `bob build`.
enableScripts: true

# Keep the cache inside the project, as .gitignore already assumes.
enableGlobalCache: false
compressionLevel: mixed

# Deliberately not set, though the Yarn 3 -> 4 migration adds both:
#   approvedGitRepositories: ["**"]  - this project has no git-protocol
#     dependencies, so blanket-approving every repository buys nothing.
#   npmMinimalAgeGate: 0             - disables Yarn's one-day quarantine on
#     freshly published versions, which is a supply-chain guard worth keeping.
